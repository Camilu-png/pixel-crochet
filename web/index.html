                <h1>Pixel Crochet — tapestry crochet without the counting</h1>
                <p>Pixel Crochet is a free, open-source app that turns tapestry crochet patterns into an interactive, stitch-by-stitch guide. Instead of counting every stitch while reading a pattern, you follow the current row, tap each color block as you finish it, and your progress is saved automatically.</p>
                <p>Import a PNG or JPG of pixel art or cross-stitch, or paste a Stitch Fiddle pattern, and Pixel Crochet builds a row-by-row guide with the reading direction, yarn colors and a progress bar. Made stitch by stitch.</p>
                <p>Pixel Crochet es una app gratuita y de código abierto que convierte patrones de tapestry crochet en una guía interactiva puntada a puntada.</p>
            </div>
