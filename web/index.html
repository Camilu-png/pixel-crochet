            <div style="max-width:760px;margin:0 auto;padding:40px 24px;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;color:#241F2B;background:#FFF9F2;">
                <h1>Pixel Crochet — tapestry crochet sin contar puntos a mano</h1>
                <p>Pixel Crochet es una app <strong>gratuita y de código abierto</strong> que convierte tus imágenes —e incluso patrones de texto de Stitch Fiddle— en una guía de crochet punto a punto: te dice qué color tejer, cuántos puntos, y guarda tu progreso automáticamente para que no pierdas la cuenta.</p>
                <h2>Qué puedes hacer</h2>
                <ul>
                    <li>Subir una imagen de pixel art, punto de cruz, un logo o una foto y elegir el ancho en puntos.</li>
                    <li>Pegar un patrón de texto de Stitch Fiddle y seguirlo de forma interactiva.</li>
                    <li>Reasignar cada color detectado a la lana que de verdad tienes, antes de empezar.</li>
                    <li>Seguir el patrón fila a fila: dirección de lectura, bloques contados y fila activa resaltada.</li>
                    <li>Tocar para marcar progreso y retomar justo donde quedaste, con guardado automático.</li>
                </ul>
                <h2>Tu foto nunca sale de tu dispositivo</h2>
                <p>Todo el procesamiento de imágenes ocurre en tu teléfono o navegador. No necesitas cuenta, registro ni pagar nada.</p>
                <h2>Una buganda, hecha punto a punto</h2>
                <p>Mi mamá está tejiendo una buganda con Pixel Crochet y dice que le ayuda muchísimo: ya no pierde la cuenta a mitad de una fila.</p>
                <h2>Preguntas frecuentes</h2>
                <p><strong>¿Qué es el pixel crochet?</strong> Es una técnica de crochet colorwork en la que cada punto es un píxel; también se llama tapestry crochet o graphgan. Pixel Crochet, la app, convierte imágenes en esa cuadrícula y te guía para tejerla.</p>
                <p><strong>¿Sirve para mantas con dibujo o C2C?</strong> Sí: cualquier pieza que se teja contando cuadros —tapestry, graphgan, C2C, bugandas, punto de cruz.</p>
                <p><strong>¿Tengo que pagar?</strong> No. Pixel Crochet es gratuita y de código abierto (MIT).</p>
                <p><strong>¿Mis fotos se suben a un servidor?</strong> No, todo se procesa en tu dispositivo.</p>
                <h2>Guías y recursos</h2>
                <ul>
                    <li><a href="/como-hacer-pixel-crochet">Cómo hacer pixel crochet y tapestry crochet</a> (guía en español)</li>
                    <li><a href="/convertir-imagen-a-patron-de-crochet">Convertir una imagen en patrón de crochet</a> (guía en español)</li>
                    <li><a href="/stitch-fiddle-to-crochet-guide">Stitch Fiddle patterns to an interactive guide</a> (english)</li>
                    <li><a href="https://github.com/Camilu-png/pixel-crochet">Código fuente en GitHub</a> (MIT)</li>
                    <li><a href="https://ko-fi.com/pixel_crochet/shop">Tienda de patrones en Ko-fi</a></li>
                </ul>
                <p>Pixel Crochet is a free, open-source app that turns images and Stitch Fiddle patterns into a stitch-by-stitch tapestry crochet guide. Everything runs on your device.</p>
